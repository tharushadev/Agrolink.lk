spring.application.name=demo
# Configure MongoDB via env var to avoid committing secrets.
# Example: set MONGODB_URI to your Atlas connection string.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/agrolink}
server.port=8080
server.address=0.0.0.0

# Dev-only: seed demo users on startup.
# No demo credentials are hardcoded in the codebase; configure via env vars / local properties.
app.seed-demo-users=false
app.seed-demo-users.force=false

# Configure demo users only in local/dev environments (do not commit real credentials)
# Example structure:
# app.demo-users.users[0].phoneNumber=
# app.demo-users.users[0].password=
# app.demo-users.users[0].role=
# app.demo-users.users[0].nic=
# app.demo-users.users[0].firstName=
# app.demo-users.users[0].lastName=
# app.demo-users.users[0].profileImageUrl=
# app.demo-users.users[0].gnCertificateUrl=
